                  - /url: https://scryfall.com/search?q=%21%22Lurrus+of+the+Dream-Den%22&utm_source=mw_MTGWiki
                - text: is banned. It is the first power level ban in Vintage since 1996, as if it were to be restricted its
                - link "companion" [ref=e2408] [cursor=pointer]:
                  - /url: /wiki/Companion
                - text: mechanic would have made the restriction meaningless.
                - superscript [ref=e2409]:
                  - link "Reference 105" [ref=e2410] [cursor=pointer]:
                    - /url: "#cite_note-May_2020-105"
                    - text: "[105]"
              - listitem [ref=e2411]:
                - text: "Commander: The legal card definition is synced up with other constructed formats, meaning the previous \"non-legal\" cards (i.e. banned cards in Vintage prior to"
                - link "Lurrus of the Dream-Den" [ref=e2412] [cursor=pointer]:
                  - /url: https://scryfall.com/search?q=%21%22Lurrus+of+the+Dream-Den%22&utm_source=mw_MTGWiki
                - text: ) are explicitly banned instead.
                - superscript [ref=e2413]:
                  - link "Reference 106" [ref=e2414] [cursor=pointer]:
                    - /url: "#cite_note-106"
                    - text: "[106]"
                - text: . This in response to the banning of
                - link "Lurrus of the Dream-Den" [ref=e2415] [cursor=pointer]:
                  - /url: https://scryfall.com/search?q=%21%22Lurrus+of+the+Dream-Den%22&utm_source=mw_MTGWiki
                - text: in Vintage, which the rules committee decided could remain legal in Commander.
