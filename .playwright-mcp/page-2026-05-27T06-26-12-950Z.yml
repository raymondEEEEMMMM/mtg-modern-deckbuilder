              - listitem [ref=e2436]:
                - text: On June 10, in the wake of the
                - link "Black Lives Matter" [ref=e2437] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Black_Lives_Matter
                - text: protests. WotC made an announcement that "cards whose art, text, name, or a combination thereof that are racially or
                - link "culturally offensive" [ref=e2438] [cursor=pointer]:
                  - /url: /wiki/Culturally_offensive
                - text: "\" are banned in sanctioned events."
                - superscript [ref=e2439]:
                  - link "Reference 109" [ref=e2440] [cursor=pointer]:
                    - /url: "#cite_note-109"
                    - text: "[109]"
                - text: Seven cards were banned immediately when the announcement was made, and their card images and flavor texts were removed from the
                - link "Gatherer" [ref=e2441] [cursor=pointer]:
                  - /url: /wiki/Gatherer
                - text: database. This ban also applied to Commander and some non-sanctioned formats.
