              - text: announces
              - link "bans" [ref=e858] [cursor=pointer]:
                - /url: /wiki/Banned
              - text: and
              - link "restrictions" [ref=e859] [cursor=pointer]:
                - /url: /wiki/Restricted_cards
              - text: of cards for their sanctioned formats if they deemed necessary to do so. In normal cases, these announcements are made on Mondays and take effect within a few days.
            - paragraph [ref=e860]:
              - text: Previously, such announcements used to be made in a scheduled basis (usually two to three months) with coherence of
              - link "Standard" [ref=e861] [cursor=pointer]:
