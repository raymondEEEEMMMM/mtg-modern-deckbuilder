            - paragraph [ref=e2452]:
              - text: The announcement schedule is changed to Monday following each expansion's release prerelease event as well as the fifth Monday after the
              - link "Pro Tour" [ref=e2453] [cursor=pointer]:
                - /url: /wiki/Pro_Tour
              - text: of respective expansion.
              - superscript [ref=e2454]:
                - link "[75]" [ref=e2455] [cursor=pointer]:
                  - /url: "#cite_note-BRQ1_2017-75"
              - text: "The schedule was scaled back and revised in June 2017: Banned and restricted announcements are decoupled from set releases and the competitive schedule. Instead, updates are announced on a scheduled basis, which are mostly in a 2-3 month span."
