                - text: ": Format is created (then called Type 1.5). \"Type 1.5 tournament decks may be constructed from Magic: The Gathering cards from the Limited (first edition, with black border) series, the Unlimited (second edition), Revised (third edition), Fourth Edition, any other Magic: The Gathering expansion (unless expressly disallowed by the head judge prior to the event), and promotional cards released by Wizards of the Coast in magazines or through books.\" There are no restricted cards. The list of banned cards is the sum of all cards that are either restricted or banned in Vintage or Standard."
